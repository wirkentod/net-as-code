name: Network Automation Deploy

on:
  #push:
  #  branches:
  #    - main  # It will run automatically on every push to the 'main' branch.
  # Triggered exclusively on-demand via the GitHub web UI
  workflow_dispatch:
  
# Automatically cancels old executions if the runner was shut down.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-deploy:
    # Force the pipeline to run exclusively on your local host controller.
    runs-on: [self-hosted, net-control]
    # Enforces a strict 3-minute execution limit once the job actually starts
    timeout-minutes: 3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Recreate Vault Password File
        run: |
          # Rebuild the local vault password file with strict 600 permissions
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .ansible_vault_pass
          chmod 600 .ansible_vault_pass

      - name: Validate Syntax and Lint Code
        run: |
          # Navigate, activate the secure venv, and run syntax checks
          cd /opt/net-as-code
          source .venv/bin/activate
          ansible-lint site-playbook.yaml
          ansible-playbook site-playbook.yaml -i inventory.yaml -e @vars_secrets.yaml --syntax-check

      - name: Dry Run (Dry-Run / Simulation Mode)
        run: |
          # Simulate changes to switches without modifying anything permanently
          cd /opt/net-as-code
          source .venv/bin/activate
          ansible-playbook site-playbook.yaml -i inventory.yaml -e @vars_secrets.yaml --check

      - name: Deploy Configuration to Switches
        run: |
          # Execute the actual playbook to push configurations live
          cd /opt/net-as-code
          source .venv/bin/activate
          ansible-playbook site-playbook.yaml -i inventory.yaml -e @vars_secrets.yaml